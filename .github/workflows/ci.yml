name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ── Go 后端 ──────────────────────────────────────────
  go-lint:
    name: Go Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache-dependency-path: backend/go.sum

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y gcc musl-tools libsqlite3-dev

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: v1.55.2
          working-directory: backend
          args: --timeout=5m

  go-test:
    name: Go Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache-dependency-path: backend/go.sum

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y gcc musl-tools libsqlite3-dev

      - name: Vet
        working-directory: backend
        run: go vet ./...

      - name: Test
        working-directory: backend
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: backend/coverage.out
          retention-days: 3

  go-build:
    name: Go Build
    runs-on: ubuntu-latest
    needs: [go-lint, go-test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache-dependency-path: backend/go.sum

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y gcc musl-tools libsqlite3-dev

      - name: Build
        working-directory: backend
        run: CGO_ENABLED=1 go build -o /dev/null ./cmd/server

  # ── Android 客户端 ────────────────────────────────────
  android-build:
    name: Android Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Assemble Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 3

  android-lint:
    name: Android Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Lint
        working-directory: android
        run: ./gradlew lint --no-daemon

      - name: Upload lint report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: android/app/build/reports/lint-results-*.html
          retention-days: 3

  cleanup:
    name: Cleanup Old Artifacts
    runs-on: ubuntu-latest
    needs: [go-build, android-build, android-lint]
    if: always()
    steps:
      - name: Delete artifacts older than 6 hours
        uses: actions/github-script@v7
        with:
          script: |
            const sixHoursAgo = new Date(Date.now() - 6 * 60 * 60 * 1000);
            const { owner, repo } = context.repo;
            
            for await (const response of github.paginate.iterator(
              github.rest.actions.listArtifactsForRepo,
              { owner, repo, per_page: 100 }
            )) {
              for (const artifact of response.data) {
                const createdAt = new Date(artifact.created_at);
                if (createdAt < sixHoursAgo) {
                  try {
                    await github.rest.actions.deleteArtifact({
                      owner,
                      repo,
                      artifact_id: artifact.id,
                    });
                    console.log(`Deleted ${artifact.name} (${artifact.id}) created at ${artifact.created_at}`);
                  } catch (e) {
                    console.error(`Failed to delete ${artifact.id}: ${e.message}`);
                  }
                }
              }
            }
