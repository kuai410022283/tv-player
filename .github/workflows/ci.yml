name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: write

jobs:
  cleanup:
    name: Cleanup Old Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Delete artifacts older than 6 hours
        uses: actions/github-script@v7
        with:
          script: |
            const sixHoursAgo = new Date(Date.now() - 6 * 60 * 60 * 1000);
            const { owner, repo } = context.repo;
            
            for await (const response of github.paginate.iterator(
              github.rest.actions.listArtifactsForRepo,
              { owner, repo, per_page: 100 }
            )) {
              for (const artifact of response.data) {
                const createdAt = new Date(artifact.created_at);
                if (createdAt < sixHoursAgo) {
                  try {
                    await github.rest.actions.deleteArtifact({
                      owner,
                      repo,
                      artifact_id: artifact.id,
                    });
                    console.log(`Deleted ${artifact.name} (${artifact.id}) created at ${artifact.created_at}`);
                  } catch (e) {
                    console.error(`Failed to delete ${artifact.id}: ${e.message}`);
                  }
                }
              }
            }

  # ── Go 后端 ──────────────────────────────────────────
  go-lint:
    name: Go Lint
    runs-on: ubuntu-latest
    needs: cleanup
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: backend/go.sum

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y gcc musl-tools libsqlite3-dev

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: v1.61.0
          working-directory: backend
          args: --timeout=5m

  go-test:
    name: Go Test
    runs-on: ubuntu-latest
    needs: cleanup
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: backend/go.sum

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y gcc musl-tools libsqlite3-dev

      - name: Vet
        working-directory: backend
        run: go vet ./...

      - name: Test
        working-directory: backend
        run: go test -v -race -coverprofile=coverage.out ./...

  go-build:
    name: Go Build
    runs-on: ubuntu-latest
    needs: [go-lint, go-test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: backend/go.sum

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y gcc musl-tools libsqlite3-dev

      - name: Build
        working-directory: backend
        run: CGO_ENABLED=1 go build -o /dev/null ./cmd/server

  # ── Android 客户端 ────────────────────────────────────
  android-build:
    name: Android Build
    runs-on: ubuntu-latest
    needs: cleanup
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle (no dependency cache)
        uses: gradle/actions/setup-gradle@v3
        with:
          # 禁用 Gradle 依赖缓存，防止跨 workflow 的旧缓存损坏 .aar/.so 结果
          cache-disabled: true

      - name: Verify local native libs exist
        run: |
          echo "=== 本地 .aar 文件 ==="
          ls -lh android/app/libs/
          echo "=== jniLibs .so 文件 ==="
          find android/app/src/main/jniLibs -name "*.so" | sort | xargs ls -lh

      - name: Assemble Debug + Release APK
        working-directory: android
        run: ./gradlew assembleDebug assembleRelease --no-daemon --no-build-cache

      - name: Verify APK native lib contents
        run: |
          echo "=== 验证 arm64-v8a Release APK native 库 ==="
          APK=$(find android/app/build/outputs/apk/release -name "*arm64-v8a*.apk" | head -1)
          echo "检查: $APK ($(($(stat -c%s "$APK") / 1024 / 1024)) MB)"
          unzip -l "$APK" | grep "lib/arm64" | awk '{print $NF, $1}'
          echo "---"
          if unzip -l "$APK" | grep -q "libffmpegJNI.so"; then
            echo "✅ libffmpegJNI.so 已打包 (FFmpeg 音频解码正常)"
          else
            echo "❌ 缺少 libffmpegJNI.so！MP2 音频将无法解码！"
            exit 1
          fi
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 3

      - name: Upload Release APK (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 3

  android-lint:
    name: Android Lint
    runs-on: ubuntu-latest
    needs: cleanup
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Lint
        working-directory: android
        run: ./gradlew lint --no-daemon
