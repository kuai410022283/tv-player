name: Docker

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  # 替换为你的 Docker Hub 镜像名
  IMAGE_NAME: laoknas/mediaplayer

jobs:
  docker:
    name: Build & Push
    runs-on: ubuntu-latest
    # 只有当提交信息中包含 release: v 关键字（忽略大小写），或者是打 tag(v*)，或者是 Pull Request 时才执行
    if: >
      github.event_name == 'pull_request' || 
      startsWith(github.ref, 'refs/tags/') || 
      contains(github.event.head_commit.message, 'release: v')
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version
        id: extract_version
        run: |
          # 优先从 git tag 提取版本号（如 refs/tags/v1.2.3 → v1.2.3）
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "VERSION=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            # 尝试从提交信息中提取 release: v 后面的版本号
            COMMIT_MSG="${{ github.event.head_commit.message }}"
            VERSION=$(echo "$COMMIT_MSG" | grep -oP '(?<=release: v)[0-9a-zA-Z.-]+' | head -1 || true)
            if [ -n "$VERSION" ]; then
              echo "VERSION=v$VERSION" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=latest

      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          context: backend
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.extract_version.outputs.VERSION || github.sha }}
