name: Extract Keystore and Passwords
on: workflow_dispatch

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      # 1. 导出 Base64 格式的 Keystore 文件并作为附件提供下载
      - name: Decode and Save Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
      
      - name: Upload Keystore Artifact
        uses: actions/upload-artifact@v4
        with:
          name: original-release-keystore
          path: release.keystore
          retention-days: 1

      # 2. 获取密码（通过 Base64 编码以防被 GitHub 自动打码 ***）
      - name: Extract Passwords
        run: |
          echo "=== 你的密码被转码成了 Base64 以防被屏蔽 ==="
          echo "ANDROID_KEYSTORE_PASSWORD:"
          echo -n "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" | base64
          echo ""
          echo "ANDROID_KEY_ALIAS:"
          echo -n "${{ secrets.ANDROID_KEY_ALIAS }}" | base64
          echo ""
          echo "ANDROID_KEY_PASSWORD:"
          echo -n "${{ secrets.ANDROID_KEY_PASSWORD }}" | base64
          echo ""
