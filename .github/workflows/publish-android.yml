name: Publish - Android APK

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (例如 v1.2.3)'
        required: true
        type: string

permissions:
  contents: read
  actions: write

jobs:
  android-release:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle (no dependency cache)
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: true

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache-dependency-path: backend/go.sum

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init

      - name: Build Go AAR
        run: |
          GOPATH=$(go env GOPATH)
          cd backend
          go get -tool golang.org/x/mobile/cmd/gobind
          "$GOPATH/bin/gomobile" bind -target=android -androidapi 21 -o ../android/app/libs/mobile.aar ./cmd/mobile

      - name: Verify local native libs exist
        run: |
          echo "=== 检查本地 .aar 文件 ==="
          ls -lh android/app/libs/
          echo "=== 检查 jniLibs .so 文件 ==="
          find android/app/src/main/jniLibs -name "*.so" | sort | xargs ls -lh

      - name: Decode Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > /tmp/release.keystore

      - name: Build Signed Release APK
        working-directory: android
        env:
          ANDROID_SIGNING_KEYSTORE: /tmp/release.keystore
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --no-build-cache

      - name: Cleanup Keystore
        if: always()
        run: rm -f /tmp/release.keystore

      - name: Verify APK native lib contents
        run: |
          echo "=== 验证 arm64-v8a Release APK 内的 native 库 ==="
          APK=$(find android/app/build/outputs/apk/release -name "*arm64-v8a*.apk" | head -1)
          if [ -z "$APK" ]; then
            APK=$(find android/app/build/outputs/apk/release -name "*all*.apk" | head -1)
          fi
          echo "检查 APK: $APK"
          unzip -l "$APK" | grep -E "lib/|libffmpeg|libijk" | awk '{print $NF, $1}'
          echo "---"
          if unzip -l "$APK" | grep -q "libffmpegJNI.so"; then
            echo "libffmpegJNI.so 已打包 (FFmpeg 音频解码正常)"
          else
            echo "缺少 libffmpegJNI.so！MP2/MPEG-Audio 将无法解码！"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 3