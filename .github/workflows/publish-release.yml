name: Publish - Full Release

on:
  push:
    branches: ["main", "master"]
    tags: ["v*"]

permissions:
  contents: read
  actions: write
  packages: write

jobs:
  cleanup:
    name: Cleanup Old Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Delete artifacts older than 6 hours
        uses: actions/github-script@v7
        with:
          script: |
            const sixHoursAgo = new Date(Date.now() - 6 * 60 * 60 * 1000);
            const { owner, repo } = context.repo;
            for await (const response of github.paginate.iterator(
              github.rest.actions.listArtifactsForRepo,
              { owner, repo, per_page: 100 }
            )) {
              for (const artifact of response.data) {
                const createdAt = new Date(artifact.created_at);
                if (createdAt < sixHoursAgo) {
                  try {
                    await github.rest.actions.deleteArtifact({
                      owner, repo, artifact_id: artifact.id,
                    });
                    console.log(`Deleted ${artifact.name} (${artifact.id})`);
                  } catch (e) {
                    console.error(`Failed to delete ${artifact.id}: ${e.message}`);
                  }
                }
              }
            }

  prepare-release:
    name: Prepare Release Version
    runs-on: ubuntu-latest
    needs: cleanup
    outputs:
      version: ${{ steps.get_version.outputs.VERSION }}
      should_release: ${{ steps.get_version.outputs.SHOULD_RELEASE }}
      body: ${{ steps.get_version.outputs.RELEASE_BODY }}
    steps:
      - name: Extract Version
        id: get_version
        run: |
          COMMIT_MSG=$(cat << 'EOF'
          ${{ github.event.head_commit.message }}
          EOF
          )
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "VERSION=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "SHOULD_RELEASE=true" >> $GITHUB_OUTPUT
            MSG_BODY=$(echo "$COMMIT_MSG" | sed -n '2,$p')
            echo "RELEASE_BODY<<EOF" >> $GITHUB_OUTPUT
            echo "$MSG_BODY" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            EXTRACTED=$(echo "$COMMIT_MSG" | grep -oP '(?i)Release:\s*\K(v[0-9][^\s]*)' | head -n 1)
            if [ -n "$EXTRACTED" ]; then
              echo "VERSION=$EXTRACTED" >> $GITHUB_OUTPUT
              echo "SHOULD_RELEASE=true" >> $GITHUB_OUTPUT
              MSG_BODY=$(echo "$COMMIT_MSG" | grep -oP '(?i)Release:\s*v[0-9][^\s]*\s*\K(.*)' || true)
              echo "RELEASE_BODY<<EOF" >> $GITHUB_OUTPUT
              echo "$MSG_BODY" >> $GITHUB_OUTPUT
              echo "EOF" >> $GITHUB_OUTPUT
            else
              echo "SHOULD_RELEASE=false" >> $GITHUB_OUTPUT
            fi
          fi

  # ── 调用可复用工作流 ──────────────────────────────────
  publish-binaries:
    name: Go Binaries
    needs: prepare-release
    if: needs.prepare-release.outputs.should_release == 'true'
    uses: ./.github/workflows/publish-binaries.yml
    with:
      version: ${{ needs.prepare-release.outputs.version }}

  publish-android:
    name: Android APK
    needs: prepare-release
    if: needs.prepare-release.outputs.should_release == 'true'
    uses: ./.github/workflows/publish-android.yml
    secrets: inherit
    with:
      version: ${{ needs.prepare-release.outputs.version }}

  publish-docker:
    name: Docker Image
    needs: prepare-release
    if: needs.prepare-release.outputs.should_release == 'true'
    uses: ./.github/workflows/publish-docker.yml
    with:
      version: ${{ needs.prepare-release.outputs.version }}

  # ── 跨仓库 GitHub Release ──────────────────────────────
  github-release:
    name: Cross-Repo Release
    runs-on: ubuntu-latest
    needs: [prepare-release, publish-binaries, publish-android]
    if: needs.prepare-release.outputs.should_release == 'true'
    steps:
      - name: Checkout private repo
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Sync README, LICENSE and images to public repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git clone https://x-access-token:${{ secrets.RELEASE_TOKEN }}@github.com/kuai410022283/mediaplayer.git public-repo
          cp README.md public-repo/
          cp LICENSE public-repo/ || true
          cp -r images public-repo/ || true
          cd public-repo
          git add README.md LICENSE images/
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "docs: sync README, LICENSE and images from private repo [skip ci]"
            git push origin main
          else
            echo "README.md, LICENSE and images are up to date."
          fi

      - name: Create Release in mediaplayer repo
        uses: softprops/action-gh-release@v2
        with:
          repository: kuai410022283/mediaplayer
          token: ${{ secrets.RELEASE_TOKEN }}
          target_commitish: main
          tag_name: ${{ needs.prepare-release.outputs.version }}
          name: Release ${{ needs.prepare-release.outputs.version }}
          body: ${{ needs.prepare-release.outputs.body }}
          generate_release_notes: true
          files: |
            artifacts/binary-*/**/*.tar.gz
            artifacts/binary-*/**/*.zip
            artifacts/android-apk/**/*.apk