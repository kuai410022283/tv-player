name: Publish to Public Repo

on:
  push:
    branches: ["main", "master"]
  tags: ["v*"]

permissions:
  contents: read
  actions: write

jobs:
  cleanup:
    name: Cleanup Old Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Delete artifacts older than 6 hours
        uses: actions/github-script@v7
        with:
          script: |
            const sixHoursAgo = new Date(Date.now() - 6 * 60 * 60 * 1000);
            const { owner, repo } = context.repo;
            
            for await (const response of github.paginate.iterator(
              github.rest.actions.listArtifactsForRepo,
              { owner, repo, per_page: 100 }
            )) {
              for (const artifact of response.data) {
                const createdAt = new Date(artifact.created_at);
                if (createdAt < sixHoursAgo) {
                  try {
                    await github.rest.actions.deleteArtifact({
                      owner,
                      repo,
                      artifact_id: artifact.id,
                    });
                    console.log(`Deleted ${artifact.name} (${artifact.id}) created at ${artifact.created_at}`);
                  } catch (e) {
                    console.error(`Failed to delete ${artifact.id}: ${e.message}`);
                  }
                }
              }
            }

  prepare-release:
    name: Prepare Release Version
    runs-on: ubuntu-latest
    needs: cleanup
    outputs:
      version: ${{ steps.get_version.outputs.VERSION }}
      should_release: ${{ steps.get_version.outputs.SHOULD_RELEASE }}
    steps:
      - name: Extract Version
        id: get_version
        run: |
          COMMIT_MSG=$(cat << 'EOF'
          ${{ github.event.head_commit.message }}
          EOF
          )
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "VERSION=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "SHOULD_RELEASE=true" >> $GITHUB_OUTPUT
          else
            EXTRACTED=$(echo "$COMMIT_MSG" | grep -oP '(?i)Release:\s*\K(v[0-9][^\s]*)' | head -n 1)
            if [ -n "$EXTRACTED" ]; then
              echo "VERSION=$EXTRACTED" >> $GITHUB_OUTPUT
              echo "SHOULD_RELEASE=true" >> $GITHUB_OUTPUT
            else
              echo "SHOULD_RELEASE=false" >> $GITHUB_OUTPUT
            fi
          fi

  # ── Go 多平台二进制 ───────────────────────────────────
  go-release:
    needs: prepare-release
    if: needs.prepare-release.outputs.should_release == 'true'
    name: Go Binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: ""
          - goos: linux
            goarch: arm64
            suffix: ""
          - goos: darwin
            goarch: amd64
            suffix: ""
          - goos: darwin
            goarch: arm64
            suffix: ""
          - goos: windows
            goarch: amd64
            suffix: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache-dependency-path: backend/go.sum

      - name: Install cross-compile deps
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu musl-tools libsqlite3-dev

      - name: Build and Package
        working-directory: backend
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          CC=""
          if [ "$GOOS" = "linux" ] && [ "$GOARCH" = "arm64" ]; then
            CC="aarch64-linux-gnu-gcc"
          fi
          
          BINARY_NAME="mediaplayer"
          if [ "$GOOS" = "windows" ]; then
            BINARY_NAME="mediaplayer.exe"
          fi
          
          CC=$CC go build \
            -ldflags "-s -w -X main.Version=$VERSION" \
            -o $BINARY_NAME \
            ./cmd/server
            
          # Create package directory
          PKG_NAME="mediaplayer-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }}"
          mkdir -p $PKG_NAME
          mv $BINARY_NAME $PKG_NAME/
          cp -r web $PKG_NAME/
          cp config.yaml $PKG_NAME/
          
          # Clean up any residual local data before packaging
          rm -rf $PKG_NAME/web/download/*.apk || true
          rm -f $PKG_NAME/web/build.sh || true
          
          # Create archive
          if [ "$GOOS" = "windows" ]; then
            zip -r ${PKG_NAME}.zip $PKG_NAME/
          else
            tar -czvf ${PKG_NAME}.tar.gz $PKG_NAME/
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mediaplayer-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            backend/*.tar.gz
            backend/*.zip
          retention-days: 3

  # ── Android APK ────────────────────────────────────────
  android-release:
    needs: prepare-release
    if: needs.prepare-release.outputs.should_release == 'true'
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Decode Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > /tmp/release.keystore

      - name: Build Signed Release APK
        working-directory: android
        env:
          ANDROID_SIGNING_KEYSTORE: /tmp/release.keystore
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --no-build-cache

      - name: Cleanup Keystore
        if: always()
        run: rm -f /tmp/release.keystore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mediaplayer-android
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 3

  # ── Docker 镜像 ────────────────────────────────────────
  docker-release:
    needs: prepare-release
    if: needs.prepare-release.outputs.should_release == 'true'
    name: Docker Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR with PAT
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: kuai410022283
          password: ${{ secrets.mediaplayer }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/kuai410022283/mediaplayer
          tags: |
            type=raw,value=${{ needs.prepare-release.outputs.version }}
            type=raw,value=latest

      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          context: backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ needs.prepare-release.outputs.version }}

  # ── 跨仓库 GitHub Release ───────────────────────────────
  github-release:
    name: Cross-Repo Release
    runs-on: ubuntu-latest
    needs: [prepare-release, go-release, android-release, docker-release]
    if: needs.prepare-release.outputs.should_release == 'true'
    steps:
      - name: Checkout private repo
        uses: actions/checkout@v4
        
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Sync README and images to public repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git clone https://x-access-token:${{ secrets.mediaplayer }}@github.com/kuai410022283/mediaplayer.git public-repo
          cp README.md public-repo/
          cp -r images public-repo/ || true
          cd public-repo
          git add README.md images/
          # If there are changes, commit and push
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "docs: sync README and images from private repo [skip ci]"
            git push origin main
          else
            echo "README.md and images are up to date."
          fi

      - name: Create Release in mediaplayer repo
        uses: softprops/action-gh-release@v2
        with:
          repository: kuai410022283/mediaplayer
          token: ${{ secrets.mediaplayer }}
          target_commitish: main
          tag_name: ${{ needs.prepare-release.outputs.version }}
          name: Release ${{ needs.prepare-release.outputs.version }}
          generate_release_notes: true
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
            artifacts/**/*.apk
