name: Publish to Public Repo

on:
  push:
    tags: ["v*"]

jobs:
  # ── Go 多平台二进制 ───────────────────────────────────
  go-release:
    name: Go Binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: ""
          - goos: linux
            goarch: arm64
            suffix: ""
          - goos: darwin
            goarch: amd64
            suffix: ""
          - goos: darwin
            goarch: arm64
            suffix: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache-dependency-path: backend/go.sum

      - name: Install cross-compile deps
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu musl-tools libsqlite3-dev

      - name: Build and Package
        working-directory: backend
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ github.ref_name }}
        run: |
          CC=""
          if [ "$GOOS" = "linux" ] && [ "$GOARCH" = "arm64" ]; then
            CC="aarch64-linux-gnu-gcc"
          fi
          
          BINARY_NAME="mediaplayer"
          CC=$CC go build \
            -ldflags "-s -w -X main.Version=$VERSION" \
            -o $BINARY_NAME \
            ./cmd/server
            
          # Create package directory
          PKG_NAME="mediaplayer-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }}"
          mkdir -p $PKG_NAME
          mv $BINARY_NAME $PKG_NAME/
          cp -r web $PKG_NAME/
          cp config.yaml $PKG_NAME/
          
          # Clean up any residual local data before packaging
          rm -rf $PKG_NAME/web/download/*.apk || true
          
          # Create archive
          tar -czvf ${PKG_NAME}.tar.gz $PKG_NAME/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mediaplayer-${{ matrix.goos }}-${{ matrix.goarch }}
          path: backend/*.tar.gz

  # ── Android APK ────────────────────────────────────────
  android-release:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Decode Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > /tmp/release.keystore

      - name: Build Signed Release APK
        working-directory: android
        env:
          ANDROID_SIGNING_KEYSTORE: /tmp/release.keystore
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --no-build-cache

      - name: Cleanup Keystore
        if: always()
        run: rm -f /tmp/release.keystore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mediaplayer-android
          path: android/app/build/outputs/apk/release/*.apk

  # ── Docker 镜像 ────────────────────────────────────────
  docker-release:
    name: Docker Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR with PAT
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: kuai410022283
          password: ${{ secrets.mediaplayer }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/kuai410022283/mediaplayer
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          context: backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ github.ref_name }}

  # ── 跨仓库 GitHub Release ───────────────────────────────
  github-release:
    name: Cross-Repo Release
    runs-on: ubuntu-latest
    needs: [go-release, android-release, docker-release]
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release in mediaplayer repo
        uses: softprops/action-gh-release@v2
        with:
          repository: kuai410022283/mediaplayer
          token: ${{ secrets.mediaplayer }}
          target_commitish: main
          generate_release_notes: true
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.apk
