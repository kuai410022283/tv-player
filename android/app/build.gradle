plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.mediaplayer.app'
    compileSdk 36
    ndkVersion "25.1.8937393"

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
        pickFirst 'lib/**/libc++_shared.so'
    }

    externalNativeBuild {
        cmake {
            path "src/main/jni/CMakeLists.txt"
            version "3.22.1"
        }
    }

    defaultConfig {
        applicationId "com.mediaplayer.app"
        minSdk 23
        targetSdk 34
        versionCode 113
        versionName "1.1.13"
    }

    signingConfigs {
        release {
            def keystoreFile = System.getenv("ANDROID_SIGNING_KEYSTORE")
            if (keystoreFile && new File(keystoreFile).exists()) {
                storeFile file(keystoreFile)
                storePassword System.getenv("ANDROID_SIGNING_PASSWORD")
                keyAlias System.getenv("ANDROID_SIGNING_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_SIGNING_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            def keystoreFile = System.getenv("ANDROID_SIGNING_KEYSTORE")
            if (keystoreFile && new File(keystoreFile).exists()) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
        }
    }

    splits {
        abi {
            enable true
            reset()
            include "armeabi-v7a", "arm64-v8a" // 移除 x86/x86_64 以减小 TV 端安装包体积
            universalApk true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def abi = output.getFilter(com.android.build.VariantOutput.ABI) ?: "all"
            def version = variant.versionName
            def buildType = variant.buildType.name
            outputFileName = "mediaplayer-v${version}-${abi}-${buildType}.apk"
        }
    }
}

// 编码公共服务器列表 URL（读取 PublicServerList.txt → 编码 → 生成 Kotlin 文件，不打包进 APK）
tasks.register('encodePublicServerUrls') {
    doLast {
        def xorKey = [0x3A, 0x5F, 0x8C, 0x1B, 0x6D, 0xE4, 0x2F, 0x9A] as byte[]

        def encodeUrl = { url ->
            def bytes = url.getBytes("UTF-8")
            def result = new byte[bytes.length]
            for (int i = 0; i < bytes.length; i++) {
                result[i] = (bytes[i] ^ xorKey[i % xorKey.length]) as byte
            }
            return java.util.Base64.getEncoder().encodeToString(result)
        }

        def extractUrl = { line ->
            def trimmed = line.trim()
            if (trimmed.isEmpty() || trimmed.startsWith("#")) return null
            def commaIndex = trimmed.indexOf(',')
            if (commaIndex > 0) {
                return trimmed.substring(commaIndex + 1).trim()
            }
            return trimmed
        }

        def inputFile = file("${rootProject.projectDir}/PublicServerList.txt")
        if (!inputFile.exists()) {
            logger.warn("PublicServerList.txt 不存在 (${inputFile.absolutePath})，跳过 URL 编码")
            return
        }

        def encodedLines = inputFile.readLines("UTF-8")
            .collect { extractUrl(it) }
            .findAll { it != null && !it.isEmpty() }
            .collect { encodeUrl(it) }
            .collect { "        \"$it\"" }
            .join(",\n")

        def pkg = "com.mediaplayer.app"
        def content = """// Auto-generated by encodePublicServerUrls task. DO NOT EDIT.
// Source: ${rootProject.projectDir}/PublicServerList.txt

package $pkg

object PublicServerListUrls {
    val encoded: List<String> = listOf(
$encodedLines
    )
}
"""
        def outputFile = file("${projectDir}/src/main/java/${pkg.replace('.', '/')}/PublicServerListUrls.kt")
        outputFile.parentFile.mkdirs()
        if (!outputFile.exists() || outputFile.text != content) {
            outputFile.text = content
            logger.lifecycle("已从 PublicServerList.txt 生成 PublicServerListUrls.kt")
        }
    }
}

tasks.named('preBuild') {
    dependsOn('encodePublicServerUrls')
}

dependencies {
    // AndroidX
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.preference:preference-ktx:1.2.1'

    // Leanback (Android TV)
    implementation 'androidx.leanback:leanback:1.0.0'
    implementation 'androidx.leanback:leanback-tab:1.1.0-beta01'

    // Media3 / ExoPlayer
    implementation 'androidx.media3:media3-exoplayer:1.10.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.10.1'
    implementation 'androidx.media3:media3-exoplayer-dash:1.10.1'
    // PATCHED: using local module instead of AAR for RTSP SDP parsing fix
    // Search for "PATCHED" in :media3-rtsp-patched to see modifications.
    // To revert: replace with  implementation 'androidx.media3:media3-exoplayer-rtsp:1.10.1'
    implementation project(':media3-rtsp-patched')
    implementation 'androidx.media3:media3-ui:1.10.1'

    // MPV Network Dependency updated
    // implementation 'io.github.abdallahmehiz:mpv-android-lib:0.1.12'
    // MPV Network Dependency (Converted to Local AAR for offline availability)
    implementation files('libs/mpv-android-lib-0.1.12.aar')

    implementation 'androidx.media3:media3-common:1.10.1'
    implementation 'androidx.media3:media3-datasource-okhttp:1.10.1'
    // AV3A FFmpeg 扩展直接采用影子类源码集成，不再需要 AAR
    // implementation files('libs/lib-decoder-ffmpeg-release.aar')

    // VLC Android SDK removed

    // IJKPlayer dependency removed
    
    // Network
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // Image loading
    implementation 'io.coil-kt:coil:2.5.0'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // QR Code Generator
    implementation 'com.google.zxing:core:3.5.3'

    // Embedded Web Server
    implementation 'org.nanohttpd:nanohttpd:2.3.1'

    // Splash Screen
    implementation 'androidx.core:core-splashscreen:1.0.1'

    // Go Mobile Proxy Engine (本地代理，用于直连组播流)
    implementation files('libs/mobile.aar')
}
