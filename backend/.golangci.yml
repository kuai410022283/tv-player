version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused

  settings:
    errcheck:
      # 不检查这些函数的错误返回值
      exclude-functions:
        - (database/sql.Rows).Close
        - (*database/sql.Rows).Close
        - (io.Closer).Close
        - (net/http.ResponseWriter).Write
        - (c *gin.Context).ShouldBindJSON
        - json.Unmarshal
        - (http.ResponseWriter).Write
        - (*sql.Rows).Scan
        - rand.Read
        - os.MkdirAll
