version: "2"

linters:
  default: none
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused

  settings:
    errcheck:
      # 不检查这些函数的错误返回值
      exclude-functions:
        - (database/sql.Rows).Close
        - (io.Closer).Close
        - (net/http.ResponseWriter).Write
