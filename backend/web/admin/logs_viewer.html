<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>系统日志</title>
  <script>
    if (window.top === window.self) {
      window.location.replace('/admin/');
    }
  </script>
  <style>
    body { margin: 0; padding: 16px; font-family: system-ui, -apple-system, sans-serif; background: #fff; color: #333; display: flex; flex-direction: column; height: 100vh; box-sizing: border-box; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .tabs { display: flex; gap: 8px; }
    .tab { padding: 8px 16px; border: 1px solid #ddd; border-radius: 6px; cursor: pointer; background: #f9f9f9; user-select: none; }
    .tab.active { background: #1296db; color: #fff; border-color: #1296db; }
    .actions { display: flex; gap: 8px; }
    button { padding: 8px 16px; border: 1px solid #ddd; border-radius: 6px; cursor: pointer; background: #fff; display: flex; align-items: center; gap: 6px; }
    button:hover { background: #f0f0f0; }
    select { padding: 8px; border: 1px solid #ddd; border-radius: 6px; outline: none; }
    .log-container { flex: 1; background: #1e1e1e; color: #d4d4d4; font-family: monospace; padding: 12px; border-radius: 8px; overflow-y: auto; white-space: pre-wrap; word-break: break-all; margin-top: 12px; }
    .client-selector { display: none; margin-top: 12px; align-items: center; gap: 8px; }
    .status { font-size: 12px; color: #666; }
  </style>
</head>
<body>
  <div class="header">
    <div class="tabs">
      <div class="tab active" data-type="backend" data-i18n="logs.backend_tab">后台终端日志</div>
      <div class="tab" data-type="client" data-i18n="logs.client_tab">客户端日志</div>
    </div>
    <div class="actions">
      <select id="refresh-interval" style="padding: 6px; font-size: 13px; border: 1px solid #ddd; border-radius: 6px; outline: none; background: #f9f9f9;">
        <option value="0" selected data-i18n="logs.no_refresh">不自动刷新</option>
        <option value="3000" data-i18n="logs.refresh_3s">自动 (3s)</option>
        <option value="5000" data-i18n="logs.refresh_5s">5秒</option>
        <option value="10000" data-i18n="logs.refresh_10s">10秒</option>
        <option value="30000" data-i18n="logs.refresh_30s">30秒</option>
        <option value="60000" data-i18n="logs.refresh_1m">1分钟</option>
        <option value="300000" data-i18n="logs.refresh_5m">5分钟</option>
      </select>
      <button id="btn-refresh" data-i18n="logs.btn_refresh">刷新</button>
      <button id="btn-export" data-i18n="logs.btn_export">导出当前</button>
    </div>
  </div>
  
  <div class="client-selector" id="client-selector">
    <select id="client-list">
      <option value="" data-i18n="logs.select_client">-- 选择设备日志 --</option>
    </select>
    <button id="btn-delete-client" style="color: #d32f2f;" data-i18n="logs.btn_delete">删除日志</button>
  </div>

  <div class="log-container" id="log-view"></div>

  <script src="/static/i18n.js"></script>
  <script src="/static/logs.js"></script>
</body>
</html>
